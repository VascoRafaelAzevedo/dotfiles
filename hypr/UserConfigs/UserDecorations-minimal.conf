# UserDecorations-minimal.conf — Gruvbox static, square, no blur/shadow

# No dynamic wallust colours — static Gruvbox palette
# Active border  : Gruvbox orange  #fe8019
# Inactive border: Gruvbox bg2     #504945

general {
  border_size = 1
  gaps_in = 0
  gaps_out = 0

  col.active_border   = rgba(fe8019ff)
  col.inactive_border = rgba(504945ff)
}

decoration {
  rounding = 0

  active_opacity   = 1.0
  inactive_opacity = 0.98
  fullscreen_opacity = 1.0

  dim_inactive  = false
  dim_strength  = 0.0
  dim_special   = 0.0

  shadow {
    enabled = false
  }

  blur {
    enabled = false
  }
}

group {
  col.border_active = rgba(fe8019ff)

  groupbar {
    col.active = rgba(282828ff)
  }
}
