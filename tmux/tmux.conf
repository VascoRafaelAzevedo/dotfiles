# ~/.tmux.conf — Configuração para Dev com Neovim
# Setup: Neovim (Gruvbox) + Copilot CLI + GDB | Wayland | Debian

# ==========================================
# GERAL
# ==========================================

# Prefix: Ctrl+a (mais ergonómico que Ctrl+b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Recarregar config com Prefix + r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf recarregado!"

# Reduzir delay do escape — CRÍTICO para Neovim
set -sg escape-time 0

# Histórico de scrollback
set -g history-limit 50000

# Numeração começa em 1
set -g base-index 1
set -g pane-base-index 1

# Renumerar janelas ao fechar uma
set -g renumber-windows on

# Rato: scroll, clicar para mudar painel
set -g mouse on

# Modo vi nas teclas de cópia
set-window-option -g mode-keys vi

# Focus events — nvim detecta quando ganha/perde foco (útil para autoread)
set -g focus-events on

# Clipboard passthrough
set -g set-clipboard on

# Tempo de display de mensagens
set -g display-time 2000

# Monitorizar actividade em janelas em background
set -g monitor-activity on
set -g visual-activity off

# ==========================================
# CORES E TRUE COLOR
# Necessário para Gruvbox no Neovim funcionar correctamente
# ==========================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# ==========================================
# BARRA DE STATUS — tema Gruvbox (powerline)
# Requer Nerd Font (ex: JetBrainsMono Nerd Font)
# ==========================================

set -g status-position bottom
set -g status-style bg=colour237,fg=colour223
set -g status-left-length 50
set -g status-right-length 130

# Esquerda: sessão com powerline
set -g status-left "#[fg=colour235,bg=colour142,bold]  #S #[fg=colour142,bg=colour237,nobold] "

# Janelas inactivas com separadores
setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour237,bg=colour239]#[fg=colour246,bg=colour239] #I  #W #[fg=colour239,bg=colour237]"

# Janela activa — laranja Gruvbox com powerline
setw -g window-status-current-format "#[fg=colour237,bg=colour214]#[fg=colour235,bg=colour214,bold] #I  #W #[fg=colour214,bg=colour237]"

# Actividade em background
setw -g window-status-activity-style bg=colour237,fg=colour167,bold

# Direita: git branch + data + hora
set -g status-right "#[fg=colour239,bg=colour237]#[fg=colour246,bg=colour239]  #(cd '#{pane_current_path}'; git branch --show-current 2>/dev/null) #[fg=colour241,bg=colour239]#[fg=colour223,bg=colour241]  %d/%m/%Y #[fg=colour214,bg=colour241]#[fg=colour235,bg=colour214,bold]  %H:%M "

# Mensagens (Prefix + r, etc.)
set -g message-style bg=colour214,fg=colour235,bold

# Bordas dos painéis
set -g pane-border-style fg=colour239
set -g pane-active-border-style fg=colour214

# ==========================================
# CLIPBOARD — Wayland (wl-copy)
# ==========================================

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# Cópia ao soltar o botão do rato
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# ==========================================
# DIVISÃO DE PAINÉIS
# Mantém o directório actual ao dividir
# ==========================================

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ==========================================
# NAVEGAÇÃO ENTRE PAINÉIS
# Abordagem manual is_vim: funciona sem plugin no Neovim.
# Os keymaps Ctrl+hjkl em vim-options.lua tratam os splits nvim.
# O tmux passa as teclas ao nvim quando este está activo.
# ==========================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Redimensionar painéis com Prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==========================================
# JANELAS
# ==========================================

# Shift+Setas para mudar de janela (sem prefix)
bind -n S-Right next-window
bind -n S-Left previous-window

# Alt+Tab: ciclo MRU (Most Recently Used) entre janelas
# Lista MRU atualizada em cada navegação normal; congelada durante o ciclo Alt+Tab
set-hook -g after-select-window 'run-shell "~/.tmux/mru-update.sh"'
bind -n M-Tab run-shell "~/.tmux/mru-next.sh"

# Mover janela esq/dir
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ==========================================
# PLUGINS (TPM)
# Instalar TPM primeiro:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Depois: Prefix + I para instalar plugins
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# --- tmux-resurrect: guardar estado do nvim ---
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh gdb cargo make python node gh'

# --- tmux-continuum: auto-save + auto-restore ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# --- tmux-yank: clipboard Wayland ---
set -g @yank_action 'copy-pipe'

# DEVE SER A ÚLTIMA LINHA
run '~/.tmux/plugins/tpm/tpm'
